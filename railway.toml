# Railway deployment for the IronHawk DEX Matrix monorepo.
#
# The server must run as a single always-on instance. scanner.ts drives the
# scan loop with setInterval and uses Postgres advisory locks (namespace 4243
# for scans, 4242 for trades) to serialise work — both assume exactly one
# long-lived process sharing one database. Do not enable autoscaling here:
# the app is safe with two instances (the locks hold) but there is no benefit,
# and a serverless host that suspends the process silently stops scanning.

[build]
# NOTE: deliberately NOT using --frozen-lockfile.
#
# The workspace lockfile drifts from the package.json files whenever a script
# is added (as one was, to introduce the root `start` command), and
# --frozen-lockfile turns that into a hard install failure before the build
# even begins. Letting pnpm reconcile the lockfile on deploy costs a few
# seconds and removes a failure mode that has nothing to do with the code
# being deployed. Restore the flag once the lockfile is known to be in sync.
#
# --prefer-offline is kept: it speeds up repeat deploys by using the local
# store where possible without skipping the registry when something is missing.
buildCommand = "pnpm install --prefer-offline && pnpm run build"

[deploy]
startCommand = "pnpm --filter @workspace/api-server run start"

# Restart on crash, but cap the attempts — a crash loop that restarts forever
# burns through the wallet if the failure is in the trading path. Ten attempts
# is enough to ride out a transient RPC or database blip without masking a
# real, repeating fault.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Live trading is deliberately NOT configured here. Per the project's security
# model, TRADING_ENABLED and TRADING_CLOSES_ENABLED must be set as service
# variables in the Railway dashboard, and left unset until wallet
# configuration, market-data safeguards and owner access have been verified.
# With them unset the server boots, scans, records signals, and refuses every
# trade — which is the intended first deployment.
